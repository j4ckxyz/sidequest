# Nginx reverse proxy: public HTTPS → local Bun/Hono recs service on 127.0.0.1:8787.
# Put at /etc/nginx/sites-available/sidequest-recs and symlink into sites-enabled,
# then run certbot (see below) to fill in the TLS cert automatically.
#
#   sudo ln -s /etc/nginx/sites-available/sidequest-recs /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d recs.sidequest.je    # provisions + auto-renews Let's Encrypt cert
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name recs.sidequest.je;           # <-- your subdomain
    # certbot adds the :443 TLS server block + redirects 80→443 automatically.

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # refresh can take a little while
    }
}

# CORS is handled by the app (Hono cors()), so do NOT add add_header 'Access-Control-*'
# here — doubling them breaks preflight. Firewall: expose 443 (and 80 for certbot) only;
# keep 8787 bound to localhost (the service already binds 127.0.0.1 by default).
